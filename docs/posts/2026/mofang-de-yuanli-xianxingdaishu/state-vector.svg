<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">魔方状态的两种编码</title>
  <desc id="desc">左侧用贴纸位置向量和置换矩阵表示一次面转动，右侧用角块和棱块的排列、朝向坐标压缩状态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60728a" />
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #263449; }
      .title { font-size: 23px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #53647a; }
      .box { fill: #f7f9fc; stroke: #d5deea; stroke-width: 2; rx: 14; }
      .cell { stroke: white; stroke-width: 3; rx: 4; }
    </style>
  </defs>
  <rect width="1120" height="450" fill="#ffffff" />
  <text x="560" y="42" class="title" text-anchor="middle">转动是置换：完整贴纸表示与压缩块坐标</text>

  <rect x="32" y="72" width="500" height="330" class="box" />
  <text x="282" y="106" class="head" text-anchor="middle">贴纸位置向量</text>
  <text x="282" y="132" class="small" text-anchor="middle">48 个可移动贴纸位置 × 每格 6 维颜色 one-hot 向量</text>

  <g transform="translate(65 162)">
    <text x="0" y="-12" class="small">转动前：位置 1 … 48</text>
    <rect x="0" y="0" width="150" height="74" rx="8" fill="#fff" stroke="#cad4e2" stroke-width="2" />
    <g class="cell">
      <rect x="9" y="9" width="34" height="24" fill="#f5f5f4" />
      <rect x="58" y="9" width="34" height="24" fill="#ebbd31" />
      <rect x="107" y="9" width="34" height="24" fill="#d84343" />
      <rect x="9" y="41" width="34" height="24" fill="#326bb2" />
      <rect x="58" y="41" width="34" height="24" fill="#3d9a70" />
      <rect x="107" y="41" width="34" height="24" fill="#f08b39" />
    </g>
    <text x="75" y="98" class="small" text-anchor="middle">x = (x₁, x₂, …, x₄₈)</text>
  </g>

  <g transform="translate(238 190)">
    <rect x="0" y="0" width="84" height="70" rx="10" fill="#eaf0f8" stroke="#cdd8e6" stroke-width="2" />
    <text x="42" y="28" class="head" text-anchor="middle">P<tspan baseline-shift="sub" font-size="12">R</tspan></text>
    <text x="42" y="51" class="small" text-anchor="middle">右面转动</text>
  </g>
  <path d="M 218 224 L 234 224" stroke="#60728a" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 327 224 L 347 224" stroke="#60728a" stroke-width="3" marker-end="url(#arrow)" />

  <g transform="translate(355 162)">
    <text x="0" y="-12" class="small">转动后：贴纸颜色不变，位置重排</text>
    <rect x="0" y="0" width="150" height="74" rx="8" fill="#fff" stroke="#cad4e2" stroke-width="2" />
    <g class="cell">
      <rect x="9" y="9" width="34" height="24" fill="#d84343" />
      <rect x="58" y="9" width="34" height="24" fill="#326bb2" />
      <rect x="107" y="9" width="34" height="24" fill="#ebbd31" />
      <rect x="9" y="41" width="34" height="24" fill="#f5f5f4" />
      <rect x="58" y="41" width="34" height="24" fill="#3d9a70" />
      <rect x="107" y="41" width="34" height="24" fill="#f08b39" />
    </g>
    <text x="75" y="98" class="small" text-anchor="middle">x′ = (P<tspan baseline-shift="sub" font-size="10">R</tspan> ⊗ I₆)x</text>
  </g>

  <rect x="560" y="72" width="528" height="330" class="box" />
  <text x="824" y="106" class="head" text-anchor="middle">压缩成小块坐标</text>
  <text x="824" y="132" class="small" text-anchor="middle">不逐格记颜色，直接记录每块去了哪里、朝向如何</text>

  <g transform="translate(604 165)">
    <text x="0" y="0" class="body" font-weight="700">角块（8 个）</text>
    <g transform="translate(0 18)">
      <rect x="0" y="0" width="208" height="70" rx="9" fill="#fff" stroke="#cad4e2" stroke-width="2" />
      <text x="14" y="27" class="body">排列 c</text>
      <text x="14" y="52" class="small">每个角位置上是哪一块</text>
      <rect x="220" y="0" width="208" height="70" rx="9" fill="#fff" stroke="#cad4e2" stroke-width="2" />
      <text x="234" y="27" class="body">朝向 o<tspan baseline-shift="sub" font-size="11">c</tspan> ∈ Z₃⁸</text>
      <text x="234" y="52" class="small">每块扭转 0、1 或 2 格</text>
    </g>
  </g>
  <g transform="translate(604 278)">
    <text x="0" y="0" class="body" font-weight="700">棱块（12 个）</text>
    <g transform="translate(0 18)">
      <rect x="0" y="0" width="208" height="70" rx="9" fill="#fff" stroke="#cad4e2" stroke-width="2" />
      <text x="14" y="27" class="body">排列 e</text>
      <text x="14" y="52" class="small">每个棱位置上是哪一块</text>
      <rect x="220" y="0" width="208" height="70" rx="9" fill="#fff" stroke="#cad4e2" stroke-width="2" />
      <text x="234" y="27" class="body">朝向 o<tspan baseline-shift="sub" font-size="11">e</tspan> ∈ Z₂¹²</text>
      <text x="234" y="52" class="small">每块翻转 0 或 1 次</text>
    </g>
  </g>
  <text x="824" y="382" class="small" text-anchor="middle">角朝向和 ≡ 0 (mod 3)；棱翻转和 ≡ 0 (mod 2)</text>
</svg>
